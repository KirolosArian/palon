<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b3440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>PALON - لعبة المنطاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=25">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-bar">
      <div class="press" title="عدّاد النفخ"><span class="press-ic">🎈</span><div class="prog"><div id="hudPress"></div></div></div>
      <div id="hudM" class="meters">0 m</div>
      <div class="coins"><span class="coin-ic"></span><span id="hudC">0/0</span></div>
    </div>
    <div class="hud-sub">
      <div class="lvl-wrap"><div id="hudL" class="lvl-tag">ليفل 1</div><div class="lvl-prog"><div id="hudLP"></div></div></div>
      <button id="pauseBtn" class="icon-btn" aria-label="pause">
        <svg viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#2b3440"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#2b3440"/></svg>
      </button>
    </div>
    <div id="hudOpp" class="opp-tag hidden"></div>
    <div id="hudMsg" class="hud-msg"></div>
    <div id="banner"></div>
  </div>

  <div id="controls" class="hidden">
    <button class="ctl" id="btnL" aria-label="left">
      <svg viewBox="0 0 40 40"><path d="M25 10 L13 20 L25 30 Z" fill="#fff" stroke="#2b3440" stroke-width="3" stroke-linejoin="round"/></svg>
    </button>
    <button class="ctl" id="btnR" aria-label="right">
      <svg viewBox="0 0 40 40"><path d="M15 10 L27 20 L15 30 Z" fill="#fff" stroke="#2b3440" stroke-width="3" stroke-linejoin="round"/></svg>
    </button>
    <button class="ctl" id="btnD" aria-label="deflate">
      <svg viewBox="0 0 60 60"><path d="M16 16 L30 28 L44 16" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 30 L30 42 L44 30" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="ctl big" id="btnU" aria-label="boost">
      <svg viewBox="0 0 60 60"><path d="M16 30 L30 18 L44 30" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 44 L30 32 L44 44" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div id="specBar" class="hidden">
    <div class="spec-top"><button id="specExit" class="icon-btn" aria-label="exit">✕</button><span class="live">● LIVE</span><span id="specW">👀 1</span></div>
    <button class="spec-chip" id="spec0"></button><div class="spec-prog"><div id="specP0" class="red"></div></div>
    <button class="spec-chip" id="spec1"></button><div class="spec-prog"><div id="specP1" class="blue"></div></div>
    <div class="spec-tip">دوس على اسم عشان تتابعه</div>
  </div>
  <div id="overlay"></div>
</div>
<script src="game.js?v=25"></script>
</body>
</html>
